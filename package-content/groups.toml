#:schema https://raw.githubusercontent.com/4lve/SteelMC/refs/heads/master/package-content/groups.schema.json

# Permission groups assigned by the server.
#
# `default_groups` are applied to every player. Add `"op"` to a player's
# global player data groups to grant the built-in operator group, or edit the
# group below to match the server's needs.

default_groups = ["default"]

[groups.default]
# Higher priority wins when equally specific rules from multiple groups match.
priority = 0
allow = []
deny = []
# Permission rule expressions can add contexts. Omit `{...}` for a global rule.
# Multiple context selectors are combined with AND.
#
# allow = [
#     "minecraft.command.gamemode{domain=lobby}",
# ]
#
# deny = [
#     "minecraft.command.gamemode.creative{world=lobby:spawn}",
# ]
#
# Custom contexts are available for plugins/subsystems that provide matching
# runtime context during permission checks. Namespaced keys are preferred for
# plugin-owned contexts.
#
# allow = [
#     "plugin.region.build{world=lobby:spawn,plugin:region=spawn}",
# ]
#
# Permission values configure typed metadata resolved through the same context
# expression model. Metadata rules are ordered; later equally specific entries
# win as the final deterministic tie-breaker.
#
# metadata = [
#     { key = "plugin:homes", value = 10 },
#     { key = "plugin:homes{domain=survival}", value = 5 },
# ]
metadata = []

[groups.op]
priority = 0
allow = ["*"]
deny = []
metadata = []
