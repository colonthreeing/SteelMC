#:schema https://raw.githubusercontent.com/4lve/SteelMC/refs/heads/master/package-content/groups.schema.json

# Permission groups assigned by the server.
#
# `default_groups` are applied to every player. Add `"op"` to a player's
# global player data groups to grant the built-in operator group, or edit the
# group below to match the server's needs.

default_groups = ["default"]

[groups.default]
# Higher priority wins when equally specific rules from multiple groups match.
priority = 0
allow = []
deny = []
# Structured rules can add a context. Omit `context` for a global rule.
# Each rule may use one context selector: `domain`, `world`, or `custom`.
#
# [[groups.default.rules]]
# key = "minecraft.command.gamemode"
# state = "allow"
# context = { domain = "lobby" }
#
# [[groups.default.rules]]
# key = "minecraft.command.gamemode.creative"
# state = "deny"
# context = { world = "lobby:spawn" }
#
# Custom contexts are available for plugins/subsystems that provide matching
# runtime context during permission checks.
#
# [[groups.default.rules]]
# key = "plugin.region.build"
# state = "allow"
# context = { custom = { key = "region", value = "spawn" } }
#
# Permission values configure typed metadata resolved through the same context
# model. Values are separate from boolean allow/deny rules.
#
# [[groups.default.values]]
# key = "plugin:homes"
# value = 10
# context = { domain = "survival" }

[groups.op]
priority = 0
allow = ["*"]
deny = []
